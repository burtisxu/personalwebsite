  <style>
    /* ── Variables ───────────────────── */
    :root {
      --bg:       #ffffff;
      --text:     #1d1f21;
      --muted:    #666666;
      --border:   #e5e7eb;
      --accent:   #2563eb;
      --max-w:    940px;
    }

    /* ── Reset ───────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-width: 320px;
    }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Nav ─────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
    }
    .nav-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -.02em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }
    .nav-links a {
      padding: 6px 11px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s;
      white-space: nowrap;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
      outline: none;
    }
    .nav-links a.active-nav {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Sections ────────────────────── */
    section {
      padding: 28px 0;
    }
    h2 {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.03em;
      color: var(--text);
      margin-bottom: 14px;
      border: none;
    }

    /* ── Hero ────────────────────────── */

      padding-top: 56px;
      padding-bottom: 28px;
    }
    .hero-inner {
      display: flex;
      align-items: flex-start;
      gap: 28px;
    }
    .hero-photo {

      width: 96px;
      height: 96px;
    }
    .hero-avatar {
      width: 96px;
      height: 96px;
      border-radius: 6px;

      background: #f3f4f6;
    }
    .hero-text {
      flex: 1;
      min-width: 0;
    }
    .hero-name {
      font-size: 36px;
      font-weight: 650;
      letter-spacing: -.04em;
      color: var(--text);
      margin-bottom: 2px;
      line-height: 1.12;
    }
    .hero-title {
      font-size: 16px;

    .hero-affiliation {

      color: var(--muted);
      margin-bottom: 8px;
    }
    .hero-bio {
      font-size: 14px;
      line-height: 1.55;

    .hero-links {

    .hero-links a {

    }

    /* ── Research Interests ──────────── */

      padding-top: 14px;
    }

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;

    }

      font-size: 13.5px;

      line-height: 1.3;
    }

      text-decoration: none;

    .wp-title a:hover {

    }
    .wp-authors {
      font-size: 14px;
      color: var(--muted);
      margin-top: 3px;
    }
    .wp-status {

    .wp-links {

      gap: 12px;

      font-size: 14px;

    /* ── Publications ─────────────────── */
    #publications {

    }
    .pub-item .pub-authors strong {
      font-weight: 600;
      color: var(--text);
    }
    .pub-item .pub-meta {
      font-size: 14px;
      color: var(--muted);

    }
    .pub-item .pub-journal {

    }
    .pub-item .pub-links {
      font-size: 14px;
      color: var(--muted);
      margin-top: 1px;
    }
    .pub-item .pub-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }
    .pub-item .pub-link:hover {
      text-decoration: underline;
    }

    /* ── Work in Progress ────────────── */
    .wip-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 48px;
      row-gap: 20px;
    }
    .wip-item-simple {
      min-width: 0;
    }
    .wip-item-simple .wip-item-title {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.4;

    }
    .wip-item-simple .wip-item-coauthors {
      margin-top: 3px;
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--muted);
    }

    /* ── Conferences ─────────────────── */
    .conf-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .conf-item {
      display: flex;
      gap: 16px;
      padding: 5px 0;
      font-size: 14px;
      line-height: 1.55;
    }
    .conf-year {
      flex-shrink: 0;

    .conf-content {

    .conf-content .conf-title {
      font-weight: 600;
      color: var(--text);
    }
    .conf-content .conf-detail {
      color: var(--muted);
    }

    /* ── Education ───────────────────── */
    .edu-list {
      display: flex;
      flex-direction: column;
    }
    .edu-item {
      padding: 8px 0;
      font-size: 15px;
      line-height: 1.55;
    }
    .edu-degree {
      font-weight: 600;
      color: var(--text);
    }
    .edu-school {
      font-weight: 600;
      color: var(--text);
    }
    .edu-year {
      color: var(--muted);
    }

    /* ── Contact ─────────────────────── */
    #contact {
      padding-top: 20px;
      padding-bottom: 20px;
    }
    .contact-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
    }
    .contact-link:hover {
      text-decoration: underline;
    }
    .contact-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }

    /* ── Footer ──────────────────────── */
    footer {
      padding: 22px 0 18px;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .footer-inner {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: -.01em;

    /* ── Responsive: ≤768px ──────────── */
    @media (max-width: 768px) {
      .container { padding: 0 18px; }
      .research-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-inner { flex-direction: column; align-items: center; text-align: center; gap: 18px; }
      .hero-photo { width: 80px; height: 80px; }
      .hero-avatar { width: 80px; height: 80px; }
      .hero-name { font-size: 30px; }
      .nav-links { gap: 0; overflow-x: auto; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links a { padding: 6px 8px; font-size: 13px; }
      .wp-header { flex-direction: column; gap: 0; }
      .hero-links { justify-content: center; }
      .conf-year { width: 44px; }
    }

    /* ── Responsive: ≤480px ──────────── */
    @media (max-width: 480px) {
      .container { padding: 0 16px; }
      .research-grid { grid-template-columns: 1fr; }
      .hero-name { font-size: 28px; }
      .hero-photo { width: 72px; height: 72px; }
      .hero-avatar { width: 72px; height: 72px; }
      h2 { font-size: 19px; }
      .nav-name { font-size: 14px; }
      .nav-links a { font-size: 12px; padding: 6px 7px; }
      .hero-links { flex-direction: column; gap: 6px; }
      .conf-year { width: 40px; font-size: 13px; }
    }

    @media (max-width: 650px) {
      .wip-list {
        grid-template-columns: 1fr;
        row-gap: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <!-- Data layer -->
  <script src="data.js"></script>

  <!-- Render engine -->
  <script>
  (function () {
    var data = window.loadSiteData();

    /* ── Nav ─────────────────────────── */
    document.getElementById('navName').textContent = data.personal.name;
    document.title = data.personal.name + ' | Economic History Research';

    /* ── Hero ────────────────────────── */
    document.getElementById('heroName').textContent  = data.personal.name;
    document.getElementById('heroTitle').textContent = data.personal.title;
    // Affiliation — derive from education data
    var affEl = document.getElementById('heroAffiliation');
    if (data.education.length > 0) {
      affEl.textContent = data.education[0].school;
    }
    document.getElementById('heroBio').textContent   = data.personal.bio;

    var pa = document.getElementById('heroPhotoArea');
    if (data.personal.avatar) {
      var img = document.createElement('img');
      img.className = 'hero-avatar';
      img.src = data.personal.avatar;
      img.alt = data.personal.name;
      pa.appendChild(img);
    }

    // Hero quick links — only show when data exists
    var c = data.contact;
    var heroLinks = document.querySelector('.hero-links');
    var hasAnyLink = false;

    // CV — hidden by default (no CV field in data yet)
    var cvEl = document.getElementById('cvLink');
    cvEl.style.display = 'none';

    var emailEl = document.getElementById('emailLink');
    if (c.email) {
      emailEl.href = 'mailto:' + escAttr(c.email);
      hasAnyLink = true;
    } else {
      emailEl.style.display = 'none';
    }

    var scholarEl = document.getElementById('scholarLink');
    if (c.scholar) {
      scholarEl.href = escAttr(c.scholar);
      scholarEl.target = '_blank';
      scholarEl.rel = 'noopener';
      hasAnyLink = true;
    } else {
      scholarEl.style.display = 'none';
    }

    if (!hasAnyLink) {
      heroLinks.style.display = 'none';
    }

    /* ── Research ────────────────────── */
    var rList = document.getElementById('researchList');
    data.research.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'research-card';
      var desc = r.description ? '<div class="research-card-desc">' + escHTML(r.description) + '</div>' : '';
      card.innerHTML =
        '<div class="research-card-title">' + escHTML(r.title) + '</div>' + desc;
      rList.appendChild(card);
    });

    /* ── Working Papers ──────────────── */
    renderWorkingPapers('wpList', data.workingPapers);

    /* ── Publications ────────────────── */
    renderPublications('pubList', data.publications);

    /* ── Work in Progress ────────────── */
    var wipSection = document.getElementById('work-in-progress');
    var wipGrid = document.getElementById('wipGrid');
    if (data.workInProgress.length === 0) {
      wipSection.style.display = 'none';
    } else {
      data.workInProgress.forEach(function (w) {
        var div = document.createElement('div');
        div.className = 'wip-item-simple';
        var co = w.coauthors ? '<div class="wip-item-coauthors">with ' + escHTML(w.coauthors) + '</div>' : '';
        div.innerHTML =
          '<div class="wip-item-title">' + escHTML(w.title) + '</div>' + co;
        wipGrid.appendChild(div);
      });
    }

    /* ── Conferences ─────────────────── */
    var confSection = document.getElementById('conferences');
    var confList = document.getElementById('confList');
    if (data.conferences.length === 0) {
      confSection.style.display = 'none';
    } else {
      data.conferences.forEach(function (conf) {
        var div = document.createElement('div');
        div.className = 'conf-item';
        div.innerHTML =
          '<div class="conf-year">' + escHTML(conf.date) + '</div>' +
          '<div class="conf-content">' +
            '<span class="conf-title">' + escHTML(conf.title) + '</span>' +
            ' <span class="conf-detail">&mdash; ' + escHTML(conf.conference) + ', ' + escHTML(conf.location) + '</span>' +
          '</div>';
        confList.appendChild(div);
      });
    }

    /* ── Education ───────────────────── */
    var eduList = document.getElementById('eduList');
    data.education.forEach(function (e) {
      var div = document.createElement('div');
      div.className = 'edu-item';
      div.innerHTML =
        '<span class="edu-school">' + escHTML(e.school) + '</span>' +
        ' &mdash; <span class="edu-degree">' + escHTML(e.degree) + '</span>' +
        ', <span class="edu-year">' + escHTML(e.year) + '</span>';
      eduList.appendChild(div);
    });

    /* ── Contact ─────────────────────── */
    var links = document.getElementById('contactLinks');
    var linkHTML = '';
    if (c.email) {
      linkHTML +=
        '<a href="mailto:' + escAttr(c.email) + '" class="contact-link">' +
        '<svg viewBox="0 0 24 24"><path d="M1.5 4.75A1.75 1.75 0 013.25 3h17.5c.966 0 1.75.784 1.75 1.75v14.5A1.75 1.75 0 0120.75 21H3.25a1.75 1.75 0 01-1.75-1.75V4.75zm1.75-.25a.25.25 0 00-.25.25v.616l8.356 7.115a1 1 0 001.288 0L21 5.366V4.75a.25.25 0 00-.25-.25H3.25zM21 6.973l-7.544 6.425a2.5 2.5 0 01-2.912 0L3 6.973v12.277c0 .138.112.25.25.25h17.5a.25.25 0 00.25-.25V6.973z"/></svg>' +
        escHTML(c.email) + '</a>';
    }
    if (c.github) {
      linkHTML +=
        '<a href="' + escAttr(c.github) + '" target="_blank" rel="noopener" class="contact-link">' +
        '<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>' +
        'GitHub</a>';
    }
    if (c.scholar) {
      linkHTML +=
        '<a href="' + escAttr(c.scholar) + '" target="_blank" rel="noopener" class="contact-link">' +
        '<svg viewBox="0 0 24 24"><path d="M12 2L1 7l11 5 9-4.1V16h2V7l-2.5-1.1L12 2zm0 2.18l7.42 3.37L12 10.4l-7.42-3.37L12 4.18zM4 11v4.45c0 .55.28 1.05.75 1.35L12 21l7.25-4.2c.47-.3.75-.8.75-1.35V11l-2 1v3.45L12 19l-6-3.55V12l-2-1z"/></svg>' +
        'Google Scholar</a>';
    }
    links.innerHTML = linkHTML;

    /* ── Footer ──────────────────────── */
    document.getElementById('footerYear').textContent = '2026';
    document.getElementById('footerName').textContent = data.personal.name;

    /* ── Scroll-spy: nav active state ── */
    (function () {
      var sections = document.querySelectorAll('section[id]');
      var navLinks = document.querySelectorAll('.nav-links a');

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var id = entry.target.id;
            navLinks.forEach(function (link) {
              var isActive = link.getAttribute('href') === '#' + id;
              link.classList.toggle('active-nav', isActive);
            });
          }
        });
      }, { rootMargin: '-30% 0px -60% 0px' });

      sections.forEach(function (sec) { observer.observe(sec); });
    })();

    /* ── Shared: Working Papers renderer ── */
    function renderWorkingPapers(listId, items) {
      var list = document.getElementById(listId);
      var section = document.getElementById('working-papers');
      if (items.length === 0) {
        if (section) section.style.display = 'none';
        return;
      }
      items.forEach(function (p) {
        var div = document.createElement('div');
        div.className = 'wp-item';

        var titleHTML = p.link
          ? '<a href="' + escAttr(p.link) + '" target="_blank" rel="noopener">' + escHTML(p.title) + '</a>'
          : escHTML(p.title);

        var hasAbstract = p.abstract && p.abstract.trim().length > 0;
        var hasLinks = p.link || p.ssrn || p.fullText;

        var html =
          '<div class="wp-header">' +
            '<div>' +
              '<div class="wp-title">' + titleHTML + '</div>' +
              '<div class="wp-authors">' + escHTML(p.authors || '') + '</div>' +
            '</div>' +
            '<div class="wp-status">' + escHTML(p.year || '') + '</div>' +
          '</div>';

        if (hasLinks) {
          var pills = '';
          if (p.link)     pills += '<a href="' + escAttr(p.link) + '" target="_blank" rel="noopener" class="wp-link">DOI</a>';
          if (p.ssrn)     pills += '<a href="' + escAttr(p.ssrn) + '" target="_blank" rel="noopener" class="wp-link">SSRN</a>';
          if (p.fullText) pills += '<a href="' + escAttr(p.fullText) + '" target="_blank" rel="noopener" class="wp-link">PDF</a>';
          html += '<div class="wp-links">' + pills + '</div>';
        }

        if (hasAbstract) {
          html += '<button class="wp-abstract-toggle" aria-expanded="false">Abstract</button>';
          html += '<div class="wp-abstract">' + escHTML(p.abstract) + '</div>';
        }

        div.innerHTML = html;

        if (hasAbstract) {
          var toggle = div.querySelector('.wp-abstract-toggle');
          var abstract = div.querySelector('.wp-abstract');
          toggle.addEventListener('click', function () {
            var isOpen = abstract.classList.toggle('open');
            toggle.textContent = isOpen ? 'Hide Abstract' : 'Abstract';
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          });
        }

        list.appendChild(div);
      });
    }

    /* ── Shared: Publications renderer ── */
    function renderPublications(listId, items) {
      var list = document.getElementById(listId);
      var section = document.getElementById('publications');
      if (items.length === 0) {
        if (section) section.style.display = 'none';
        return;
      }
      items.forEach(function (p) {
        var div = document.createElement('div');
        div.className = 'pub-item';

        // Title-first hierarchy
        var html = '<div class="pub-title">' + escHTML(p.title) + '</div>';

        if (p.authors) {
          html += '<div class="pub-authors">' +
            escHTML(p.authors).replace(/Xu,\s*H\./g, '<strong>Xu, H.</strong>') +
            '</div>';
        }

        // Journal, Year
        var meta = '';
        if (p.journal) meta += '<span class="pub-journal">' + escHTML(p.journal) + '</span>';
        if (p.year)    meta += (meta ? ', ' : '') + escHTML(p.year);
        if (meta) html += '<div class="pub-meta">' + meta + '</div>';

        // Links: Journal · DOI · PDF
        var links = [];
        if (p.link)     links.push('<a href="' + escAttr(p.link) + '" target="_blank" rel="noopener" class="pub-link">DOI</a>');
        if (p.fullText) links.push('<a href="' + escAttr(p.fullText) + '" target="_blank" rel="noopener" class="pub-link">PDF</a>');
        if (links.length) html += '<div class="pub-links">' + links.join(' · ') + '</div>';

        div.innerHTML = html;
        list.appendChild(div);
      });
    }

    /* ── Helpers ─────────────────────── */
    function escHTML(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function escAttr(str) {
      return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  })();
  </script>
</body>
</html>
